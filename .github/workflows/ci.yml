name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build ZawUpscale.slnx -c Release
      - name: Tests
        run: dotnet test ZawUpscale.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: TestResults

  package:
    name: Package (${{ matrix.rid }})
    needs: build
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The Windows build runs on Windows: only there does the SDK embed the icon (and version info) into the .exe.
        # No osx-x64: ONNX Runtime ships no native library for Intel Macs.
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-arm64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish single-file build
        # A vX.Y.Z tag stamps the build with that version.
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          sh ./publish.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: zawupscale-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}

  release:
    name: GitHub release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zawupscale-*
          path: artifacts
      - name: Name the assets zawupscale-<rid>[.exe] and add SHA256SUMS
        run: |
          mkdir release
          for d in artifacts/zawupscale-*; do
            rid="${d#artifacts/zawupscale-}"
            if [ -f "$d/ZawUpscale.exe" ]; then cp "$d/ZawUpscale.exe" "release/zawupscale-$rid.exe"
            else cp "$d/ZawUpscale" "release/zawupscale-$rid"; chmod +x "release/zawupscale-$rid"; fi
          done
          (cd release && sha256sum zawupscale-* > SHA256SUMS && cat SHA256SUMS)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --title "ZawUpscale ${GITHUB_REF_NAME#v}" --generate-notes $flags
